<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal-Ease: Food Management AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-red { 0%, 100% { opacity: 1; color: #dc2626; } 50% { opacity: 0.3; color: #f87171; } }
        .animate-pulse-red { animation: pulse-red 1.5s ease-in-out infinite; }
    </style>
</head>
<body class="bg-slate-50 p-4 font-sans text-slate-900">
    <div class="max-w-md mx-auto bg-white shadow-2xl rounded-3xl p-6 border border-slate-100">
        <header class="text-center mb-6">
            <h1 class="text-xl font-extrabold tracking-tighter text-slate-800">家庭内食材管理</h1>
            <p class="text-[9px] text-slate-400 uppercase tracking-widest mt-1 font-bold">Household Management & Waste Reduction</p>
        </header>
        
        <div class="space-y-3 mb-8">
            <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100 shadow-sm">
                <p class="text-[10px] font-bold text-blue-700 mb-2 uppercase italic">Lifestyle Support: Voice</p>
                <button onclick="startVoiceInput()" class="bg-blue-500 text-white w-full py-2.5 rounded-xl font-bold text-sm shadow-md active:scale-95 transition-all">
                    音声で一括入力
                </button>
                <p id="voice_status" class="text-[9px] text-blue-400 mt-2 text-center font-medium">喋ると「今日から1週間後」の期限で登録されます</p>
            </div>

            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                <p class="text-[10px] font-bold text-slate-500 mb-2 uppercase italic">Manual Registration</p>
                <input id="item_name" type="text" placeholder="食材名" class="w-full border p-2 rounded-lg text-sm mb-2 outline-none focus:ring-2 focus:ring-emerald-400">
                <input id="expiry_date" type="date" class="w-full border p-2 rounded-lg text-sm mb-2 outline-none focus:ring-2 focus:ring-emerald-400">
                <button onclick="manualAdd()" class="bg-slate-800 text-white w-full py-2 rounded-xl font-bold text-xs hover:bg-slate-700 transition-colors">登録する</button>
            </div>
        </div>

        <div class="mb-8">
            <h2 class="font-bold text-slate-700 text-xs mb-3 flex justify-between items-center">
                冷蔵庫内の在庫管理 <span class="text-[9px] text-emerald-500 font-bold">AI OPTIMIZED</span>
            </h2>
            <ul id="inventory_list" class="space-y-2 min-h-[50px]">
                <p class="text-center text-slate-300 py-4 text-xs italic">食材が登録されていません</p>
            </ul>
        </div>

        <button onclick="suggestRecipe()" id="recipe_btn" class="bg-emerald-500 text-white w-full py-4 rounded-2xl font-black shadow-xl active:scale-95 transition-all flex items-center justify-center gap-2">
            レシピ生成
        </button>

        <div id="recipe_results" class="mt-6 grid gap-4 pb-10"></div>
    </div>

    <script>
        let inventory = [];

        // 手動追加
        async function manualAdd() {
            const name = document.getElementById('item_name').value;
            const expiry = document.getElementById('expiry_date').value;
            if(!name || !expiry) return alert("食材名と日付を入力してください");
            
            await addItemData(name, expiry);
            
            // 入力欄リセット
            document.getElementById('item_name').value = "";
            document.getElementById('expiry_date').value = "";
        }

        // 音声認識
        function startVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("このブラウザは音声認識に対応していません");
            
            const recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            document.getElementById('voice_status').innerText = "聴いています...";
            
            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                const items = text.split(/[、\s\s　]+/);
                
                // 音声入力の場合はデフォルトで「1週間後」の期限をセット
                const d = new Date();
                d.setDate(d.getDate() + 7);
                const defaultExpiry = d.toISOString().split('T')[0];
                
                items.forEach(name => { if(name) addItemData(name, defaultExpiry); });
            };
            recognition.onend = () => { document.getElementById('voice_status').innerText = "登録完了"; };
            recognition.start();
        }

        // 共通：データ送信とリスト更新
        async function addItemData(name, expiry) {
            try {
                const res = await fetch('/api/add_item', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, expiry })
                });
                const data = await res.json();
                inventory = data.inventory;
                renderList();
            } catch (e) {
                alert("データの登録に失敗しました");
            }
        }

        // リスト表示（期限表示の修正を含む）
        function renderList() {
            const list = document.getElementById('inventory_list');
            if (inventory.length === 0) {
                list.innerHTML = '<p class="text-center text-slate-300 py-4 text-xs italic">食材が登録されていません</p>';
                return;
            }

            // 賞味期限順に並び替え
            inventory.sort((a, b) => new Date(a.expiry) - new Date(b.expiry));
            
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            list.innerHTML = inventory.map(item => {
                const expiryDate = new Date(item.expiry);
                const diffTime = expiryDate.getTime() - today.getTime();
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                let statusHTML = "";
                if (diffDays < 0) {
                    statusHTML = `<span class="bg-red-500 text-white text-[9px] px-2 py-0.5 rounded font-bold">期限切れ</span>`;
                } else if (diffDays <= 3) {
                    statusHTML = `<span class="animate-pulse-red text-[10px] font-bold italic">あと ${diffDays} 日！</span>`;
                } else {
                    statusHTML = `<span class="text-slate-400 text-[10px]">${item.expiry}</span>`;
                }

                return `
                    <li class="bg-white border border-slate-100 p-3 rounded-xl flex justify-between items-center shadow-sm">
                        <span class="font-bold text-slate-700 text-sm">${item.name}</span>
                        <div>${statusHTML}</div>
                    </li>
                `;
            }).join('');
        }

        // レシピ提案
        async function suggestRecipe() {
            if (inventory.length === 0) return alert("食材を登録してください");
            const btn = document.getElementById('recipe_btn');
            const resDiv = document.getElementById('recipe_results');
            
            btn.innerText = "レシピ生成中...";
            resDiv.innerHTML = "";

            try {
                const res = await fetch('/api/get_recipes');
                const data = await res.json();
                
                if (!data.recipes || data.recipes.length === 0) {
                    resDiv.innerHTML = "<p class='text-center text-slate-500 text-xs py-4 bg-slate-100 rounded-xl'>条件に合うレシピが見つかりませんでした</p>";
                } else {
                    resDiv.innerHTML = data.recipes.map(r => `
                        <div class="bg-white rounded-2xl shadow-lg border border-slate-100 overflow-hidden transition-transform active:scale-95">
                            <img src="${r.image}" class="w-full h-32 object-cover">
                            <div class="p-4">
                                <h3 class="font-bold text-[11px] text-slate-800 mb-2 leading-tight h-8 overflow-hidden">${r.label}</h3>
                                <a href="${r.url}" target="_blank" class="text-emerald-500 text-[10px] font-bold uppercase tracking-tighter underline">レシピ詳細を見る</a>
                            </div>
                        </div>`).join('');
                }
            } catch (e) {
                alert("通信エラーが発生しました");
            } finally {
                btn.innerText = "レシピ生成";
            }
        }

        // 初期描画
        renderList();
    </script>
</body>
</html>
